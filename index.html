  <!-- ================= GOOGLE SITE NAME & META ================= -->

  <meta property="og:site_name" content="KuroHub">
  <meta property="og:title" content="KuroHub - Anime launchpad: search once, open everywhere">

  <!-- Structured Data (JSON-LD) for Google Search -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "KuroHub",
    "alternateName": ["Kuro Hub", "Kuro Anime Hub"],

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050805;
      --panel: #0d130d;
      --panel-hover: #121a12;
      --line: #1d2a1d;
      --line-bright: #283a28;
      --g: #22c55e;
      --g-glow: rgba(34, 197, 94, 0.35);
      --bone: #ecf3e8;
      --muted: #8fa38a;
    }
    body {
      background-color: var(--bg);
      color: var(--bone);
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
    }
    h1, h2, h3, .brand {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    }
    .panel {
      background-color: var(--panel);
      border: 1px solid var(--line);
    }
    .panel:hover {
      border-color: var(--line-bright);
    }
    .glow-hover:hover {
      box-shadow: 0 0 25px -4px var(--g-glow);
    }
    .title-glow {
      text-shadow: 0 0 24px rgba(34, 197, 94, 0.45);
    }
    .chip {
      white-space: nowrap;
      transition: all 0.2s ease;
      border: 1px solid var(--line);
      background-color: rgba(13, 19, 13, 0.7);
    }
    .chip:hover {
      border-color: var(--g);
      color: #fff;
    }
    .chip.active {
      background-color: var(--g);
      color: #031205;
      border-color: var(--g);
      font-weight: 700;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #090e09;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1d2a1d;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: var(--g);
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
